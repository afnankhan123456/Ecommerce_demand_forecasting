<!DOCTYPE html>
<html>
<head>
    <title>Ecommerce Demand Forecast</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="font-family: Arial; padding:40px; background-color:#f4f6f9;">

<h2>Ecommerce Demand Forecast Dashboard</h2>

<form method="POST">
    <input name="price" placeholder="Price" required><br><br>
    <input name="discount_percent" placeholder="Discount %" required><br><br>
    <input name="ad_spend" placeholder="Ad Spend" required><br><br>
    <input name="page_views" placeholder="Page Views" required><br><br>
    <input name="cart_additions" placeholder="Cart Additions" required><br><br>
    <input name="avg_session_time" placeholder="Avg Session Time" required><br><br>
    <input name="competitor_price" placeholder="Competitor Price" required><br><br>
    <input name="seasonality_index" placeholder="Seasonality Index" required><br><br>
    <input name="day_of_week" placeholder="Day of Week" required><br><br>

    <button type="submit">Predict</button>
</form>

{% if prediction %}

<hr>

<h3>Predicted Units Sold: {{ prediction }}</h3>
<h3>Status: {{ demand_status }}</h3>
<h4>Recommended Actions:</h4>
<p>{{ recommendation }}</p>

<div style="width:600px;">
    <canvas id="gaugeChart"></canvas>
</div>

<script>
    const predictionValue = {{ prediction }};
    const maxValue = 5000;  // Adjust based on your dataset max

    const data = {
        labels: ['Poor', 'Fair', 'Good', 'Great', 'Excellent'],
        datasets: [{
            data: [1000, 1000, 1000, 1000, 1000],
            backgroundColor: [
                '#dc3545',   // Red
                '#fd7e14',   // Orange
                '#ffc107',   // Yellow
                '#20c997',   // Light Green
                '#198754'    // Dark Green
            ],
            borderWidth: 0,
            circumference: 180,
            rotation: 270,
            cutout: '70%'
        }]
    };

    const needlePlugin = {
        id: 'needle',
        afterDraw(chart) {
            const {ctx, chartArea: {width, height}} = chart;
            ctx.save();

            const angle = Math.PI + (predictionValue / maxValue) * Math.PI;

            const cx = chart.getDatasetMeta(0).data[0].x;
            const cy = chart.getDatasetMeta(0).data[0].y;

            ctx.translate(cx, cy);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(height / 2 - 20, 0);
            ctx.lineTo(0, 5);
            ctx.fillStyle = 'black';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, 2 * Math.PI);
            ctx.fill();

            ctx.restore();
        }
    };

    new Chart(document.getElementById('gaugeChart'), {
        type: 'doughnut',
        data: data,
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                tooltip: { enabled: false }
            }
        },
        plugins: [needlePlugin]
    });
</script>

{% endif %}

</body>
</html>
